<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل المنح الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Zain:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b2e;
    --paper:#f3efe6;
    --card:#ffffff;
    --pistachio:#5f8a4a;
    --pistachio-deep:#33512a;
    --gray:#6b7280;
    --gray-deep:#4b5563;
    --line:#dcd4c2;
    --muted:#6b6459;
    --closed-soon:#b3462c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    line-height:1.6;
  }
  header{
    background:var(--pistachio-deep);
    color:#f3efe6;
    padding:2.2rem 1.5rem 2.6rem;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .header-inner{max-width:1100px;margin:0 auto;position:relative;}
  h1{
    font-family:'Zain',sans-serif;
    font-weight:800;
    font-size:clamp(1.8rem,4vw,2.6rem);
    margin:0 0 .3rem;
    letter-spacing:.3px;
  }
  .subtitle{color:#d3ddc9;font-size:.98rem;margin:0;}
  .meta-row{
    display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;
    margin-top:1.1rem;font-size:.85rem;color:#c3ceb9;
  }
  #refreshBtn{
    background:var(--gray);
    color:#fff;
    border:none;
    padding:.55rem 1.2rem;
    border-radius:999px;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #refreshBtn:hover{background:var(--gray-deep);transform:translateY(-1px);box-shadow:0 4px 14px rgba(75,85,99,.35);}
  #refreshBtn:active{transform:translateY(0);}
  #refreshBtn.spinning svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #diffBanner{
    max-width:1100px;margin:1rem auto 0;padding:.75rem 1rem;
    background:#eef5e9;border:1px solid var(--pistachio);border-radius:10px;
    font-size:.88rem;display:none;
  }

  main{max-width:1100px;margin:0 auto;padding:1.6rem 1.5rem 4rem;}

  .controls{
    display:flex;flex-wrap:wrap;gap:.7rem;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1rem;
    margin:-2.6rem 0 1.6rem;
    position:relative;
    box-shadow:0 8px 24px rgba(51,81,42,.1);
  }
  .controls select, .controls input{
    font-family:'Tajawal',sans-serif;
    border:1px solid var(--line);
    border-radius:8px;
    padding:.55rem .8rem;
    font-size:.9rem;
    background:#fbfaf6;
    color:var(--ink);
  }
  .controls input[type="search"]{flex:1;min-width:180px;}
  #searchBtn{
    background:var(--pistachio);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:.55rem 1.3rem;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
    transition:background .15s ease;
  }
  #searchBtn:hover{background:var(--pistachio-deep);}

  .count-line{font-size:.85rem;color:var(--muted);margin-bottom:1rem;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.1rem;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.2rem;
    display:flex;flex-direction:column;gap:.55rem;
  }
  .card h3{margin:0;font-size:1.08rem;font-weight:700;color:var(--pistachio-deep);}
  .badges{display:flex;flex-wrap:wrap;gap:.4rem;}
  .badge{
    font-size:.74rem;font-weight:700;padding:.22rem .6rem;border-radius:999px;
    background:#eaf3e4;color:var(--pistachio);border:1px solid #cfe0c4;
  }
  .badge.funding{background:#fbf1e2;color:#8a5a1e;border-color:#eed6ae;}
  .desc{font-size:.86rem;color:var(--ink);margin:0;}
  .desc b{color:var(--muted);font-weight:700;}
  .deadline{font-size:.84rem;font-weight:700;color:var(--closed-soon);}
  .card a.apply{
    margin-top:.4rem;
    text-align:center;
    background:var(--pistachio);
    color:#fff;
    text-decoration:none;
    padding:.55rem;
    border-radius:8px;
    font-weight:700;
    font-size:.88rem;
  }
  .card a.apply:hover{background:var(--pistachio-deep);}
  .empty{text-align:center;color:var(--muted);padding:3rem 1rem;}
  .credit{
    position:fixed;
    top:10px;
    left:10px;
    z-index:50;
    font-size:.68rem;
    line-height:1.5;
    color:rgba(255,255,255,.55);
    background:rgba(0,0,0,.15);
    padding:.35rem .6rem;
    border-radius:8px;
    text-align:left;
    direction:ltr;
  }
  .credit a{color:inherit;text-decoration:none;}
  .credit a:hover{text-decoration:underline;}
</style>
</head>

<main>

  <div class="controls">
    <select id="levelFilter">

      <option value="دكتوراه">دكتوراه</option>
      <option value="ما بعد دكتوراه">ما بعد دكتوراه</option>
    </select>
    <select id="fundingFilter">
      <option value="">كل أنواع التمويل</option>
      <option value="ممولة بالكامل">ممولة بالكامل</option>
      <option value="جزئي">تمويل جزئي</option>
      <option value="دراسة فقط">دراسة فقط (بدون تمويل)</option>
    </select>
    <select id="countryFilter">
      <option value="">كل الدول</option>
    </select>
    <select id="sortBy">
      <option value="newest">الأحدث إضافة</option>
      <option value="deadline">الأقرب انتهاءً</option>
      <option value="title">الاسم (أبجدي)</option>
    </select>
    <button id="searchBtn" onclick="render()">ابدأ البحث</button>
  </div>

  <div class="count-line" id="countLine"></div>
  <div class="grid" id="grid"></div>
</main>

let DB = EMBEDDED_DATA;

async function loadData(bust) {
  const url = 'scholarships.json' + (bust ? ('?t=' + Date.now()) : '');
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('bad response');
  return res.json();
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return iso; }
}

function fundingBadgeClass(f) {
  return 'badge funding';
}

function extractDeadlineDate(text) {
  if (!text) return null;
  let d = new Date(text);
  if (!isNaN(d)) return d;

  let m = text.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) {
    d = new Date(`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`);
    if (!isNaN(d)) return d;
  }

  m = text.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) {
    d = new Date(`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`);
    if (!isNaN(d)) return d;
  }

  const arMonths = {'يناير':1,'فبراير':2,'مارس':3,'إبريل':4,'ابريل':4,'أبريل':4,'مايو':5,'يونيو':6,'يوليو':7,'أغسطس':8,'اغسطس':8,'سبتمبر':9,'أكتوبر':10,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12};
  const re = new RegExp(`(\\d{1,2})\\s*(${Object.keys(arMonths).join('|')})\\s*(\\d{4})`);
  m = text.match(re);
  if (m) {
    d = new Date(parseInt(m[3]), arMonths[m[2]] - 1, parseInt(m[1]));
    if (!isNaN(d)) return d;
  }
  return null;
}

function removeExpired() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const before = DB.scholarships.length;
  DB.scholarships = DB.scholarships.filter(s => {
    const d = extractDeadlineDate(s.deadline);
    return !(d && d < today);
  });
  return before - DB.scholarships.length;
}

function populateCountryFilter() {
  const sel = document.getElementById('countryFilter');
  const countries = [...new Set(DB.scholarships.map(s => s.country).filter(c => c && c !== 'غير محدد'))];
  countries.sort((a, b) => a.localeCompare(b, 'ar'));
  const current = sel.value;
  sel.innerHTML = '<option value="">كل الدول</option>' +
    countries.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if (countries.includes(current)) sel.value = current;
}

function render() {
  const level = document.getElementById('levelFilter').value;
  const funding = document.getElementById('fundingFilter').value;
  const country = document.getElementById('countryFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let list = DB.scholarships.filter(s => {
    if (level && !(s.level || '').includes(level)) return false;
    if (funding && !(s.funding_type || '').includes(funding)) return false;
    if (country && s.country !== country) return false;
    return true;
  });

  if (sortBy === 'title') {
    list.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ar'));
  } else if (sortBy === 'deadline') {
    list.sort((a, b) => {
      const da = Date.parse(a.deadline), db_ = Date.parse(b.deadline);
      if (isNaN(da) && isNaN(db_)) return 0;
      if (isNaN(da)) return 1;
      if (isNaN(db_)) return -1;
      return da - db_;
    });
  } else {
    list.sort((a, b) => new Date(b.scraped_at || 0) - new Date(a.scraped_at || 0));
  }

  document.getElementById('countLine').textContent = `عدد المنح المعروضة: ${list.length} من أصل ${DB.scholarships.length}`;

  const grid = document.getElementById('grid');
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">لا توجد منح مطابقة لهذا الفلتر حاليًا.</div>';
    return;
  }

  grid.innerHTML = list.map(s => `
    <div class="card">
      <h3>${escapeHtml(s.title)}</h3>
      <div class="badges">
        <span class="badge">${escapeHtml(s.level || 'غير محدد')}</span>
        <span class="${fundingBadgeClass(s.funding_type)}">${escapeHtml(s.funding_type || 'غير محدد')}</span>
      </div>
      <p class="desc">${buildDescription(s)}</p>
      <div class="deadline">آخر موعد للتقديم: ${escapeHtml(s.deadline || 'غير محدد')}</div>
      <a class="apply" href="${s.url}" target="_blank" rel="noopener">صفحة التقديم ←</a>
    </div>
  `).join('');
}

function buildDescription(s) {
  const parts = [];
  if (s.country && s.country !== 'غير محدد') parts.push(`تُقدَّم في ${s.country}`);
  if (s.university && s.university !== 'غير محدد') parts.push(`لدى ${s.university}`);
  let text = parts.length ? escapeHtml(parts.join(' ')) + '. ' : '';
  if (s.requirements && s.requirements !== 'غير محدد') text += `<b>المتطلبات:</b> ${escapeHtml(s.requirements)}. `;
  if (s.benefits && s.benefits !== 'غير محدد') text += `<b>توفر المنحة:</b> ${escapeHtml(s.benefits)}. `;
  if (s.open_date && s.open_date !== 'غير محدد') text += `<b>فتح التقديم:</b> ${escapeHtml(s.open_date)}.`;
  return text || 'لا توجد تفاصيل إضافية متاحة حاليًا — راجع صفحة التقديم.';
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  let usedFallback = false;
  try {
    DB = await loadData(true);
  } catch (e) {
    DB = EMBEDDED_DATA;
    usedFallback = true;
  }

  const added = DB.added_since_last_run || [];
  const removedByScraper = DB.removed_since_last_run || [];
  const expiredRemoved = removeExpired();

  const now = new Date();
  const nowStr = now.toLocaleString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  document.getElementById('lastUpdated').textContent = 'آخر تحديث: ' + nowStr +
    (usedFallback ? ' (نسخة محفوظة داخل الصفحة)' : '');

  const banner = document.getElementById('diffBanner');
  const msgs = [];
  if (!usedFallback && added.length) msgs.push(`✅ أُضيفت ${added.length} منحة جديدة`);
  if (!usedFallback && removedByScraper.length) msgs.push(`❌ أُزيلت ${removedByScraper.length} منحة (مغلقة بحسب آخر تحديث للسكربت)`);
  if (expiredRemoved) msgs.push(`🗑️ حُذفت ${expiredRemoved} منحة انتهى موعدها النهائي`);
  if (msgs.length) {
    banner.style.display = 'block';
    banner.innerHTML = msgs.join(' — ');
  } else {
    banner.style.display = 'none';
  }

  populateCountryFilter();
  render();
  btn.classList.remove('spinning');
  btn.disabled = false;
}

refreshData();
</script>
